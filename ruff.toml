# ruff 설정 — 코드 컨벤션 자동 체크
# 사용법: ruff check .        (문제 찾기)
#         ruff check . --fix  (자동 수정)

line-length = 120
target-version = "py310"

# 데이터/모델 산출물은 검사 대상 아님
exclude = [
    "0_data",
    "v3_output",
    "v4_output",
    "_보관",
    "_면접자료",
    "90_기획",
    "99_참고자료",
    "*.ipynb",   # 노트북은 탐색적 코드 — lint 대상 아님 (출력·순서 의존이 정상)
]

[lint]
select = [
    "F",    # pyflakes — 미사용 import, 정의되지 않은 변수 (진짜 버그)
    "E4",   # import 위치
    "E7",   # 비교문 실수 (== None 등)
    "E9",   # 문법 오류
    "I",    # import 정렬
]

ignore = [
    "E501",  # 줄 길이 — 분석 코드는 긴 줄이 자연스러움
    "E702",  # 세미콜론 — 짧은 대입문을 의도적으로 한 줄에 정렬한 곳이 있음
]

[lint.per-file-ignores]
# 노트북에서 옮겨온 실험 스크립트는 미사용 import를 허용
"3_modeling/x_interval_experiment.py" = ["F401"]

[lint.isort]
known-first-party = ["feature_aggregator", "nan_strategies", "outlier_handler", "video_features"]
